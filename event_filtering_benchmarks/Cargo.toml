[package]
name = "event_filtering_benchmarks"
version = "0.1.0"
edition = "2021"

[dependencies]
tikv-jemallocator = "0.5"
rocksdb = "0.22"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
chrono = "0.4"
hdrhistogram = "7.5"
tempfile = "3.8"
rand = "0.8"
rand_distr = "0.4"
rkyv = { version = "0.7", features = ["validation"] }
crossbeam-channel = "0.5"
spin_sleep = "1.1"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "injector"
path = "src/bin/injector.rs"