optuna:
  n_startup_trials: 1
  n_trials: 1
  seed: {{ seed }}
  direction: maximize
architecture_configs:
  num_iterations: 500
  learning_rate: 0.0897561683419116
  num_leaves: 1002
  boosting_type: gbdt
  min_data_in_leaf: 99
  enable_bundle: True
  feature_fraction_bynode: 0.7
  lambda_l1: 1.0771268976941327e-05
  lambda_l2: 1.60588062147695e-05
  objective: {{ objective }}
  metric: custom
experiment_folder: "./WIKIPEDIA_BATCH_{{ b_size }}_trial_{{ trial }}_objective_{{ objective }}"
features:
  - "edit_size"
  - "time_decayed_count_day_edit_size"
