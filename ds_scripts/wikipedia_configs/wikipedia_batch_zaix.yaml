  - "time_decayed_average_week_edit_size"

  - "time_decayed_count_month_edit_size"
  - "time_decayed_sum_month_edit_size"
  - "time_decayed_average_month_edit_size"

  - "time_decayed_count_4838400000_edit_size"
  - "time_decayed_sum_4838400000_edit_size"
  - "time_decayed_average_4838400000_edit_size"
  
  - "time_decayed_count_9676800000_edit_size"
  - "time_decayed_sum_9676800000_edit_size"
  - "time_decayed_average_9676800000_edit_size"

  - "time_decayed_count_19353600000_edit_size"
  - "time_decayed_sum_19353600000_edit_size"
  - "time_decayed_average_19353600000_edit_size"

  - "time_decayed_count_38707200000_edit_size"
